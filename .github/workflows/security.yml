name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Critical advisories block delivery. High-severity findings are
      # reported for manual triage but do not gate the build, because
      # reachability analysis is required before a fix can be justified:
      # an advisory in an unreachable code path carries no real risk,
      # while a pipeline that fails on every advisory gets ignored.
      - name: Audit backend (blocking on critical)
        working-directory: ./server
        run: npm ci && npm audit --audit-level=critical

      - name: Audit backend (advisory report)
        working-directory: ./server
        continue-on-error: true
        run: npm audit --audit-level=high

      # GHSA-qwww-vcr4-c8h2 (react-router, CWE-352, High) is knowingly
      # accepted. The advisory affects only the unstable React Server
      # Components request handlers; this client is a Vite SPA using
      # BrowserRouter with no server-side action handlers, so the
      # vulnerable path is unreachable. The available fix is a major
      # version upgrade, tracked separately.
      - name: Audit frontend (blocking on critical)
        working-directory: ./client
        run: npm ci && npm audit --audit-level=critical

      - name: Audit frontend (advisory report)
        working-directory: ./client
        continue-on-error: true
        run: npm audit --audit-level=high

  secret-scan:
    name: Committed secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every past commit, not just
          # the current tree. A secret removed in a later commit remains
          # exposed in the history.
          fetch-depth: 0

      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo --no-banner --redact --verbose

  static-analysis:
    name: Static application security testing
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Rulesets detect injection, weak cryptographic configuration,
      # hardcoded credentials and insecure cookie attributes at source
      # level.