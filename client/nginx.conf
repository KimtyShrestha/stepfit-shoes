server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Suppress version disclosure in the Server header.
    server_tokens off;

    # Single-page application: unknown paths fall through to index.html
    # so client-side routing works on direct navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defence-in-depth headers at the edge, independent of the API.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}